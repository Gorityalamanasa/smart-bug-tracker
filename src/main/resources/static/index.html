<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Smart Bug and Issue Tracking System — Track, manage, and resolve software issues with AI-assisted triage and JWT authentication." />
  <title>Smart Bug Tracker</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🐛</text></svg>" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       LOGIN PAGE (shown before authentication)
       ═══════════════════════════════════════════ -->
  <div id="login-page" class="login-page">
    <div class="login-container">
      <div class="login-card">
        <!-- Logo -->
        <div class="login-logo-section">
          <div class="login-logo">BT</div>
          <h1 class="login-title">Smart Bug Tracker</h1>
          <p class="login-subtitle">AI-Assisted Bug Triage & Issue Management</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" autocomplete="off">
          <div class="form-group">
            <label for="login-username">Username</label>
            <input class="form-control" id="login-username" type="text" placeholder="Enter your username" required autofocus />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="password-wrapper">
              <input class="form-control" id="login-password" type="password" placeholder="Enter your password" required />
              <button type="button" class="password-toggle" id="password-toggle" tabindex="-1">👁️</button>
            </div>
          </div>

          <div id="login-error" class="login-error" style="display:none;"></div>

          <button type="submit" class="btn btn-primary login-btn" id="login-submit-btn">
            Sign In
          </button>
        </form>

        <!-- Demo credentials hint -->
        <div class="login-hint">
          <details>
            <summary>Demo Credentials</summary>
            <div class="credentials-grid">
              <div class="credential-item">
                <span class="credential-role">ADMIN</span>
                <span>admin / password123</span>
              </div>
              <div class="credential-item">
                <span class="credential-role credential-dev">DEVELOPER</span>
                <span>rahul / password123</span>
              </div>
              <div class="credential-item">
                <span class="credential-role credential-tester">TESTER</span>
                <span>tester1 / password123</span>
              </div>
            </div>
          </details>
        </div>
      </div>

      <!-- Decorative elements -->
      <div class="login-decoration">
        <div class="deco-circle deco-circle-1"></div>
        <div class="deco-circle deco-circle-2"></div>
        <div class="deco-circle deco-circle-3"></div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       APPLICATION (hidden until authenticated)
       ═══════════════════════════════════════════ -->
  <div id="app-shell" style="display:none;">

    <!-- Navbar -->
    <nav class="navbar" id="navbar">
      <div class="app-container">
        <a class="navbar-brand" href="#">
          <div class="navbar-logo">BT</div>
          <span class="navbar-title">Smart Bug Tracker</span>
        </a>
        <ul class="navbar-nav" id="nav-links">
          <li><button class="nav-btn active" data-view="dashboard">Dashboard</button></li>
          <li><button class="nav-btn" data-view="issues">Issues</button></li>
          <li id="nav-create"><button class="nav-btn" data-view="create">＋ New</button></li>
        </ul>
        <!-- User Profile (replaces "Acting as" dropdown) -->
        <div class="user-profile" id="user-profile">
          <div class="user-info">
            <div class="user-avatar" id="user-avatar">A</div>
            <div class="user-details">
              <span class="user-name" id="user-name">Admin</span>
              <span class="user-role-badge" id="user-role-badge">ADMIN</span>
            </div>
          </div>
          <button class="logout-btn" id="logout-btn" title="Sign Out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <div class="app-container" id="main-content">
        <!-- Content rendered by JS -->
      </div>
    </main>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2>Edit Issue</h2>
          <button class="modal-close" onclick="App.closeModal()">✕</button>
        </div>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/api.js?v=5"></script>
  <script src="/js/app.js?v=5"></script>
</body>
</html>
