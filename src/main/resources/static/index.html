<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Smart Bug and Issue Tracking System — Track, manage, and resolve software issues with an integrated CI/CD pipeline." />
  <title>Smart Bug Tracker</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🐛</text></svg>" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="app-container">
      <a class="navbar-brand" href="#">
        <div class="navbar-logo">BT</div>
        <span class="navbar-title">Smart Bug Tracker</span>
      </a>
      <ul class="navbar-nav">
        <li><button class="nav-btn active" data-view="dashboard">Dashboard</button></li>
        <li><button class="nav-btn" data-view="issues">Issues</button></li>
        <li><button class="nav-btn" data-view="create">＋ New</button></li>
      </ul>
      <div class="user-selector">
        <label for="current-user">Acting as:</label>
        <select id="current-user"></select>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="app-container" id="main-content">
      <!-- Content rendered by JS -->
    </div>
  </main>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Edit Issue</h2>
        <button class="modal-close" onclick="App.closeModal()">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
