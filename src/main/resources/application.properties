# ============================================
# Smart Bug Tracker - Application Properties
# ============================================

# Application
spring.application.name=Smart Bug Tracker

# Server
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bugtracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Manasa@3307

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Prevent Hibernate from keeping entities managed across the web request
spring.jpa.open-in-view=false


# Jackson JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.com.bugtracker=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# ============================================
# JWT Configuration
# ============================================
# Base64-encoded 256-bit secret key for HMAC-SHA signing
app.jwt.secret=dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JKV1RUb2tlblNpZ25pbmdJblNtYXJ0QnVnVHJhY2tlcg==
# Token expiration: 24 hours (in milliseconds)
app.jwt.expiration-ms=86400000

# ============================================
# AI Triage Configuration (Google Gemini)
# ============================================
# Set GEMINI_API_KEY environment variable, or leave empty for rule-based fallback
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
